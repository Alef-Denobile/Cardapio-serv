<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bem-vindo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="/css/inicio.css">
</head>
<body>
<main class="ini" id="ini">
  <div class="ini-veu"></div>
  <div class="ini-box">
    <div id="marca" class="ini-marca"><p class="ini-carr">Carregando…</p></div>
    <h2 class="ini-pergunta">Como você quer ver o cardápio?</h2>
    <div class="ini-opcoes">
      <a class="ini-op" id="op-online" href="#">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="36" r="5"/><circle cx="36" cy="36" r="5"/><path d="M19 36h12l6-12h-8l-4-6h-8M28 24l-6 12"/></svg>
        <strong>Pedir em casa</strong>
        <span>Entrega ou retirada no balcão, com acompanhamento do pedido</span>
      </a>
      <a class="ini-op" id="op-salao" href="#">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="26" r="12"/><circle cx="24" cy="26" r="6"/><path d="M6 10v28M3.5 10v7a2.5 2.5 0 0 0 5 0v-7M44 10c-3 0-4 4-4 9h4v19"/></svg>
        <strong>Estou no restaurante</strong>
        <span>Menu do salão, com todos os pratos por categoria</span>
      </a>
    </div>
    <p class="ini-dica">Na mesa, aponte a câmera para o QR Code para pedir direto para a cozinha.</p>
    <a class="ini-equipe" href="/painel">Área do restaurante</a>
  </div>
</main>
<script src="/js/inicio.js"></script>
</body>
</html>
