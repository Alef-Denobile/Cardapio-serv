# Blueprint PAGO do Render (banco e servidor no Render, sem "dormir"). Para usar: Blueprint → "Blueprint path" = render-pago.yaml
databases:
  - name: cardapio-db
    databaseName: cardapio
    postgresMajorVersion: "17"
    region: virginia
    plan: 0.1c-256mb   # menor plano pago; troque no painel do Render quando crescer

services:
  - type: web
    name: cardapio-digital
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cardapio-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # E-mail do "Esqueci minha senha" e das faturas (resend recomendado). Veja o README.
      - key: EMAIL_PROVEDOR
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      # Site de apresentação: "on" mostra o Pix de demonstração. Para clientes reais, deixe vazio.
      - key: PIX_DEMO
        sync: false
